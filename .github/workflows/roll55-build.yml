
name: kacchiOS Build Test

on:
  push:
    branches:
      - feat/roll55-process-manager
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Compile kacchiOS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib binutils

      - name: Create Build Directory
        run: mkdir -p build

      - name: Compile C Source Files
        run: |
          for source in *.c; do
            echo "Compiling $source"
            gcc -m32 -ffreestanding -O2 -Wall -Wextra \
              -nostdinc -fno-builtin -fno-stack-protector \
              -I. -c "$source" \
              -o "build/${source%.c}.o"
          done

      - name: Assemble Bootloader and Context Switcher
        run: |
          as --32 boot.S -o build/boot.o
          as --32 switch.S -o build/switch.o

      - name: Link Kernel
        run: |
          ld -m elf_i386 -T link.ld -o build/kernel.elf \
            build/boot.o \
            build/kernel.o \
            build/serial.o \
            build/string.o \
            build/memory.o \
            build/process.o \
            build/switch.o \
            build/scheduler.o

      - name: Verify Kernel
        run: |
          file build/kernel.elf
          echo "kacchiOS build completed successfully!"
